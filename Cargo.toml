[package]
name = "thwarter"
version = "0.43.1"
edition = "2021"
description = "A Hugo-style engine for interactive fiction"
authors = ["Thwarter Project"]
license = "MIT"

[[bin]]
name = "thwart"
path = "src/bin/thwart.rs"

[lib]
name = "thwarter"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
pulldown-cmark = "0.9"
anyhow = "1.0"
toml = "0.8"
colored = "2.0"
walkdir = "2.4"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.8.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = { version = "0.9.4", default-features = false, features = ["crossterm"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"

[dev-dependencies]
tempfile = "3.8"
